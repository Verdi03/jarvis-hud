<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050a10">
<title>JARVIS — Command Center</title>
<style>
:root{color-scheme:dark;--bg:#050a10;--panel:#0a141e;--panel2:#0d1b27;--line:rgba(126,213,233,.15);--line2:rgba(126,213,233,.3);--cyan:#72e4f5;--blue:#358db1;--text:#e5f3f6;--muted:#7f949e;--green:#70dba4;--amber:#e8bd72;--red:#ef8585;--font:Inter,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.shell{position:relative;width:100%;height:100dvh;min-height:520px;overflow:hidden;background:radial-gradient(ellipse at 50% 47%,#102331 0,#09131d 35%,#050a10 72%)}
.shell:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.19;background-image:linear-gradient(rgba(98,185,209,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(98,185,209,.07) 1px,transparent 1px);background-size:76px 76px;mask-image:radial-gradient(ellipse at center,#000 0,transparent 76%)}
.header{height:68px;position:absolute;inset:0 0 auto;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(18px,4vw,56px);border-bottom:1px solid rgba(163,220,233,.08);background:linear-gradient(180deg,rgba(5,10,16,.68),rgba(5,10,16,.08))}
.brand{display:flex;align-items:center;gap:11px;font-size:11px;letter-spacing:.24em;color:#d8edf1}.brand-mark{width:27px;height:27px;border:1px solid #71dff177;border-radius:50%;display:grid;place-items:center;color:var(--cyan);font-size:13px;box-shadow:0 0 18px #48c8e51a}
.connection{justify-self:center;display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid rgba(232,189,114,.2);border-radius:20px;background:rgba(15,22,27,.58);color:#c7b58f;font-size:9px;letter-spacing:.16em}.dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px currentColor}
.header-actions{justify-self:end;display:flex;gap:8px}.icon-btn{height:34px;min-width:38px;border:1px solid var(--line);border-radius:9px;background:rgba(10,20,29,.72);color:#a9c1c9;cursor:pointer;font-size:13px}.icon-btn:hover,.icon-btn.active{border-color:var(--line2);color:var(--cyan);background:#10212c}
.main{position:absolute;inset:68px 0 74px;display:grid;place-items:center}
.stage{position:relative;width:min(960px,100%);height:100%;display:grid;place-items:center}
.axis{position:absolute;left:50%;top:47%;width:min(66vh,580px);height:min(66vh,580px);border:1px solid rgba(104,208,230,.12);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.axis:before,.axis:after{content:"";position:absolute;inset:8%;border:1px solid rgba(104,208,230,.09);border-radius:50%;transform:rotateX(67deg)}
.axis:after{inset:18%;transform:rotateY(68deg)}
.tick-ring{position:absolute;left:50%;top:47%;width:min(47vh,410px);height:min(47vh,410px);border:1px dashed rgba(110,217,238,.18);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.tick-ring:before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(110,217,238,.08)}
.core-wrap{position:absolute;left:50%;top:47%;width:clamp(142px,22vh,204px);height:clamp(142px,22vh,204px);transform:translate(-50%,-50%);display:grid;place-items:center}
.core{width:100%;height:100%;position:relative;border-radius:50%;border:1px solid rgba(144,235,248,.72);background:radial-gradient(circle at 50% 50%,#153644 0,#0b1c28 48%,#07111a 74%);box-shadow:inset 0 0 32px rgba(93,214,237,.12),0 0 0 9px rgba(104,219,241,.035),0 0 50px rgba(46,174,207,.11);cursor:pointer;transition:transform .18s,border-color .2s,box-shadow .2s}
.core:hover{border-color:#c6f7ff;box-shadow:inset 0 0 46px rgba(93,214,237,.18),0 0 0 11px rgba(104,219,241,.05),0 0 62px rgba(46,174,207,.18)}
.core:before,.core:after{content:"";position:absolute;inset:12%;border:1px solid rgba(130,225,241,.54);border-radius:50%;transform:scaleY(.4) rotate(35deg)}
.core:after{inset:15%;transform:scaleY(.38) rotate(-35deg);border-color:rgba(130,225,241,.33)}
.core-center{position:absolute;inset:40%;border-radius:50%;background:radial-gradient(circle at 34% 28%,#f3ffff,#97eff6 32%,#44bbd1 70%,#155169);box-shadow:0 0 14px #bcf9ff,0 0 34px rgba(71,215,238,.62)}
.core-center:after{content:"";position:absolute;inset:-65%;border:1px solid rgba(139,235,246,.18);border-radius:50%}
#hud[data-state="listening"] .core{border-color:#b5f7ff;box-shadow:inset 0 0 58px rgba(74,212,241,.27),0 0 0 12px rgba(104,219,241,.09),0 0 76px rgba(46,174,207,.32)}
#hud[data-state="thinking"] .core{border-color:#84c9ef;box-shadow:inset 0 0 40px rgba(79,160,218,.19),0 0 0 10px rgba(104,219,241,.06),0 0 58px rgba(46,142,207,.2)}
#hud[data-state="speaking"] .core{border-color:#b6f8ff;box-shadow:inset 0 0 48px rgba(93,214,237,.22),0 0 0 13px rgba(104,219,241,.08),0 0 70px rgba(46,174,207,.25)}
#hud[data-state="listening"] .core-center{transform:scale(1.12)}
.visualizer{position:absolute;left:50%;top:calc(47% + clamp(112px,16vh,145px));transform:translateX(-50%);height:24px;display:flex;align-items:center;gap:4px;pointer-events:none}
.visualizer span{width:2px;height:3px;border-radius:3px;background:#8ee9f4;box-shadow:0 0 8px #59d8eb;transition:height .08s ease}
.voice-copy{position:absolute;left:50%;top:calc(47% + clamp(150px,21vh,188px));transform:translateX(-50%);width:min(580px,90vw);text-align:center}
.state{display:flex;justify-content:center;align-items:center;gap:9px;color:#d2e7eb;font-size:10px;letter-spacing:.23em}
.state .dot{background:var(--cyan);color:var(--cyan)}
#hud[data-state="idle"] .state .dot{background:#84969e;color:#84969e;box-shadow:none}
.hint{margin-top:13px;color:#8196a1;font-size:13px;letter-spacing:.02em}
.transcript{margin:17px auto 0;max-width:560px;min-height:19px;color:#d9f1f5;font-size:13px;line-height:1.5}
.transcript:empty{display:none}
.helper{margin-top:12px;color:#607781;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.quick-actions{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;white-space:nowrap}
.quick{height:33px;padding:0 13px;border:1px solid rgba(117,200,218,.15);border-radius:18px;background:rgba(9,18,26,.72);color:#8ea7b0;font-size:9px;letter-spacing:.1em;cursor:pointer}
.quick:hover{border-color:rgba(117,200,218,.4);color:#d7f4f7}
.footer{height:74px;position:absolute;inset:auto 0 0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,56px);border-top:1px solid rgba(163,220,233,.08);background:linear-gradient(0deg,rgba(5,10,16,.78),rgba(5,10,16,.12))}
.foot-left,.foot-right{color:#657a84;font-size:8px;letter-spacing:.17em}.clock{color:#82949c;font-variant-numeric:tabular-nums}
.drawer{position:absolute;z-index:8;top:84px;right:clamp(14px,3vw,42px);bottom:88px;width:min(390px,calc(100vw - 28px));padding:0;display:flex;flex-direction:column;border:1px solid rgba(120,216,235,.2);border-radius:15px;background:rgba(7,15,23,.95);box-shadow:0 20px 90px rgba(0,0,0,.55),0 0 38px rgba(64,166,197,.08);backdrop-filter:blur(18px);overflow:hidden}
.drawer[hidden]{display:none}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 15px;border-bottom:1px solid rgba(141,216,232,.11)}
.drawer-kicker{color:#7eabb7;font-size:8px;letter-spacing:.2em}.drawer-title{margin-top:5px;font-size:15px;font-weight:500;letter-spacing:.04em}
.close{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:transparent;color:#a9c1c9;cursor:pointer}
.drawer-body{padding:16px 18px 22px;overflow:auto}.demo-banner{padding:9px 10px;border:1px solid rgba(232,189,114,.2);border-radius:8px;background:rgba(82,61,24,.14);color:#c9b386;font-size:9px;letter-spacing:.07em;line-height:1.5}
.item{margin-top:14px;padding:14px;border:1px solid rgba(130,197,213,.13);border-radius:11px;background:linear-gradient(140deg,rgba(15,31,43,.88),rgba(9,18,27,.82))}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.item-title{font-size:12px;color:#d9e9ec}.pill{padding:5px 7px;border:1px solid rgba(232,189,114,.22);border-radius:20px;color:#dfc17f;font-size:8px;letter-spacing:.08em}
.meta{margin-top:9px;color:#79909a;font-size:10px;line-height:1.6}.preview{margin-top:12px;padding:12px;border-left:2px solid #5db8cc;background:#061019;color:#bacdd2;font-size:11px;line-height:1.65}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:13px;color:#8ca1a9;font-size:10px}.progress{height:3px;margin-top:9px;background:#1b2b35;border-radius:3px;overflow:hidden}.progress b{display:block;width:42%;height:100%;background:#68cee0}
.approval{margin-top:12px;padding:13px;border:1px solid rgba(112,219,164,.2);border-radius:10px;background:rgba(26,67,48,.1)}.approval-head{color:#a7dfbf;font-size:10px;letter-spacing:.06em}.approval p{margin:8px 0 0;color:#8fa69c;font-size:10px;line-height:1.55}
.actions{display:flex;gap:8px;margin-top:13px}.action{flex:1;padding:9px 8px;border:1px solid rgba(125,216,234,.2);border-radius:8px;background:rgba(14,34,44,.78);color:#a8dbe4;font-size:9px;cursor:pointer}.action.secondary{background:transparent;color:#8ea0a6}.action:disabled{opacity:.45;cursor:default}
.toast{position:absolute;z-index:12;left:50%;top:78px;transform:translateX(-50%);padding:10px 14px;border:1px solid var(--line2);border-radius:20px;background:#0b1822;color:#cdeaf0;font-size:10px;letter-spacing:.04em;opacity:0;transition:opacity .18s;pointer-events:none}.toast.show{opacity:1}
.foot-note{position:absolute;left:50%;bottom:83px;transform:translateX(-50%);z-index:3;color:#536a74;font-size:8px;letter-spacing:.13em;white-space:nowrap}
@media(max-width:680px){.header{height:60px;grid-template-columns:1fr auto;padding:0 14px}.connection{grid-column:2;grid-row:1;font-size:7px;padding:7px 8px;letter-spacing:.08em}.brand{font-size:9px;letter-spacing:.16em}.brand-mark{width:24px;height:24px}.header-actions{display:none}.main{inset:60px 0 64px}.footer{height:64px;padding:0 14px}.foot-left{max-width:52%;line-height:1.5;font-size:7px}.foot-right{font-size:7px}.axis{width:min(78vw,62vh);height:min(78vw,62vh)}.tick-ring{width:min(58vw,46vh);height:min(58vw,46vh)}.core-wrap{width:clamp(136px,25vw,184px);height:clamp(136px,25vw,184px)}.voice-copy{top:calc(47% + clamp(143px,24vw,174px))}.hint{font-size:12px}.transcript{font-size:12px}.quick-actions{bottom:15px;gap:5px}.quick{padding:0 9px;font-size:8px}.drawer{top:70px;right:10px;bottom:72px;width:min(370px,calc(100vw - 20px))}.foot-note{bottom:72px;font-size:7px}}
@media(max-height:600px){.main{inset:58px 0 60px}.core-wrap{width:130px;height:130px}.axis{width:320px;height:320px}.tick-ring{width:235px;height:235px}.voice-copy{top:calc(47% + 120px)}.visualizer{top:calc(47% + 88px)}.footer{height:60px}.quick-actions{bottom:8px}}
</style>
</head>
<body>
<main class="shell" id="hud" data-state="idle">
<header class="header">
  <div class="brand"><span class="brand-mark">J</span><span>J.A.R.V.I.S.</span></div>
  <div class="connection"><span class="dot"></span><span>MAQUETTE · IA NON CONNECTÉE</span></div>
  <div class="header-actions">
    <button class="icon-btn" id="historyBtn" aria-label="Historique" title="Historique">◷</button>
    <button class="icon-btn" id="tasksBtn" aria-label="Tâches" title="Tâches">▤</button>
    <button class="icon-btn" id="approvalsBtn" aria-label="Validations" title="Validations">✓</button>
    <button class="icon-btn" id="fullscreenBtn" aria-label="Plein écran" title="Plein écran">⛶</button>
  </div>
</header>
<section class="main">
  <div class="stage">
    <div class="axis"></div><div class="tick-ring"></div>
    <div class="core-wrap"><button class="core" id="core" aria-label="Appuyer pour parler à Jarvis"><span class="core-center"></span></button></div>
    <div class="visualizer" id="visualizer" aria-hidden="true"></div>
    <div class="voice-copy">
      <div class="state"><span class="dot"></span><span id="stateLabel">EN VEILLE</span></div>
      <div class="hint" id="hint">Appuie sur le noyau et parle naturellement</div>
      <div class="transcript" id="transcript" aria-live="polite"></div>
      <div class="helper" id="helper">Une seule voix · une seule conversation</div>
    </div>
  </div>
  <div class="quick-actions">
    <button class="quick" data-panel="tasks">ACTIVITÉ</button>
    <button class="quick" data-panel="approvals">VALIDATIONS</button>
    <button class="quick" data-panel="history">HISTORIQUE</button>
  </div>
</section>
<div class="foot-note">APERÇU INTERACTIF · LES EXEMPLES N’EXÉCUTENT AUCUNE ACTION</div>
<footer class="footer">
  <div class="foot-left">HUD VOCAL · RÉPONSE COURTE PAR DÉFAUT</div>
  <div class="clock" id="clock"></div>
  <div class="foot-right">LOCAL · EN ATTENTE</div>
</footer>
<aside class="drawer" id="drawer" hidden aria-live="polite">
  <div class="drawer-head"><div><div class="drawer-kicker" id="drawerKicker">APERÇU</div><div class="drawer-title" id="drawerTitle">Activité</div></div><button class="close" id="closeDrawer" aria-label="Fermer">×</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>
</main>
<script>
(() => {
 const hud=document.getElementById('hud'),core=document.getElementById('core'),label=document.getElementById('stateLabel'),hint=document.getElementById('hint'),transcript=document.getElementById('transcript'),helper=document.getElementById('helper'),visualizer=document.getElementById('visualizer'),drawer=document.getElementById('drawer'),drawerTitle=document.getElementById('drawerTitle'),drawerKicker=document.getElementById('drawerKicker'),drawerBody=document.getElementById('drawerBody'),toast=document.getElementById('toast');
 for(let i=0;i<29;i++){const bar=document.createElement('span');visualizer.appendChild(bar)}
 const bars=[...visualizer.children];
 let recognition=null,stream=null,ctx=null,analyser=null,frame=0,toastTimer=0,history=[];
 function setState(state,title,sub){hud.dataset.state=state;label.textContent=title;hint.textContent=sub}
 function notify(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
 function stopMeter(){if(frame)cancelAnimationFrame(frame);frame=0;bars.forEach(b=>b.style.height='3px');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}analyser=null}
 function startMeter(){const tick=()=>{if(!analyser)return;const d=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(d);let sum=0;for(const v of d){const n=(v-128)/128;sum+=n*n}const rms=Math.sqrt(sum/d.length);const level=Math.max(0,Math.min(1,(rms-.012)*7));bars.forEach((b,i)=>{const pulse=level*(.35+.65*Math.abs(Math.sin(i*.47)));b.style.height=(3+Math.round(pulse*17))+'px'});frame=requestAnimationFrame(tick)};tick()}
 async function listen(){if(recognition){recognition.stop();return}transcript.textContent='';helper.textContent='Le texte est affiché pour vérifier la reconnaissance';setState('listening','JE T’ÉCOUTE','Parle en français — clique à nouveau pour arrêter');
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();analyser=ctx.createAnalyser();analyser.fftSize=256;ctx.createMediaStreamSource(stream).connect(analyser);startMeter()}catch(e){notify('Micro non autorisé : vérifie les permissions du navigateur');setState('error','MICRO INDISPONIBLE','Autorise le microphone dans le navigateur');setTimeout(()=>setState('idle','EN VEILLE','Appuie sur le noyau et parle naturellement'),2200);return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){stopMeter();setState('error','DICTÉE INDISPONIBLE','Cette maquette ne peut pas capter la voix dans ce navigateur');setTimeout(()=>setState('idle','EN VEILLE','Appuie sur le noyau et parle naturellement'),2500);return}
  recognition=new SR();recognition.lang='fr-FR';recognition.continuous=false;recognition.interimResults=true;
  recognition.onresult=e=>{let text='';for(let i=0;i<e.results.length;i++)text+=e.results[i][0].transcript;transcript.textContent=text};
  recognition.onerror=e=>{stopMeter();recognition=null;if(e.error==='no-speech'){setState('idle','EN VEILLE','Je n’ai pas détecté de parole. Réessaie.')}else{setState('error','DICTÉE INTERROMPUE','Vérifie les permissions du micro');setTimeout(()=>setState('idle','EN VEILLE','Appuie sur le noyau et parle naturellement'),2200)}};
  recognition.onend=()=>{stopMeter();const text=transcript.textContent.trim();recognition=null;if(text){history.unshift({text,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});setState('thinking','DEMANDE CAPTÉE','Le cerveau vocal sera branché après validation de cette interface');helper.textContent='Maquette d’interface — aucune réponse IA ni action réelle';openPanel('captured',text)}else setState('idle','EN VEILLE','Appuie sur le noyau et parle naturellement')};
  try{recognition.start()}catch(e){stopMeter();recognition=null;setState('error','MICRO INDISPONIBLE','Impossible de lancer la dictée');setTimeout(()=>setState('idle','EN VEILLE','Appuie sur le noyau et parle naturellement'),2200)}
 }
 const examples={
 tasks:{kicker:'APERÇU · DONNÉES FICTIVES',title:'Tâche en cours',html:'<div class="demo-banner">SIMULATION VISUELLE · Aucun compte ni service connecté</div><div class="item"><div class="item-top"><div class="item-title">Préparer une réponse Gmail</div><span class="pill">À VALIDER</span></div><div class="meta">Demande : « Réponds à l’e-mail de Martin pour confirmer le rendez-vous de jeudi. »<br>Source : Gmail personnel · non connecté</div><div class="preview"><b>Réponse proposée</b><br>Bonjour Martin,<br>Je te confirme notre rendez-vous jeudi. À bientôt !</div><div class="row"><span>Préparation du brouillon</span><span>En attente de validation</span></div><div class="progress"><b></b></div><div class="actions"><button class="action" disabled>VALIDER ET CRÉER</button><button class="action secondary" disabled>MODIFIER</button></div></div><div class="meta">Dans la version connectée, cette fenêtre affichera l’état réel et ouvrira l’approbation liée à ce brouillon précis.</div>'},
 approvals:{kicker:'APERÇU · AUCUNE ACTION EXÉCUTABLE',title:'Centre de validation',html:'<div class="demo-banner">Rien n’est envoyé, modifié ou supprimé depuis cette maquette.</div><div class="approval"><div class="approval-head">ACTION À CONFIRMER · EXEMPLE</div><p>Créer un brouillon Gmail pour répondre à Martin. Le brouillon exact est visible ci-dessus ; aucun envoi automatique.</p><div class="actions"><button class="action" disabled>APPROUVER CETTE ACTION</button><button class="action secondary" disabled>REFUSER</button></div></div><div class="item"><div class="item-top"><div class="item-title">Règle prévue</div><span class="pill">VALIDATION HUMAINE</span></div><div class="meta">Chaque validation sera liée à l’action affichée, traçable et utilisable une seule fois.</div></div>'},
 history:{kicker:'APERÇU · HISTORIQUE DE CETTE SESSION',title:'Conversation',html:'<div class="demo-banner">La mémoire partagée HUD ↔ Telegram sera connectée plus tard.</div><div id="historyRows"></div><div class="meta">Aucune donnée n’a été envoyée à un modèle. Les phrases captées dans cette maquette restent dans cette page.</div>'},
 captured:{kicker:'APERÇU · RECONNAISSANCE LOCALE DU NAVIGATEUR',title:'Demande entendue',html:'<div class="demo-banner">La dictée est reconnue par le navigateur. Jarvis n’est pas encore relié à son cerveau vocal.</div><div class="item"><div class="item-top"><div class="item-title">Ta demande</div><span class="pill">CAPTÉE</span></div><div class="preview" id="capturedText"></div><div class="row"><span>Réponse IA</span><span>À connecter</span></div><div class="row"><span>Actions / services</span><span>Non reliés</span></div></div><div class="meta">Cette maquette vérifie l’interface et le micro ; elle ne simule pas une réponse de Jarvis.</div>'}
 };
 function openPanel(key,extra){const x=examples[key]||examples.tasks;drawerKicker.textContent=x.kicker;drawerTitle.textContent=x.title;drawerBody.innerHTML=x.html;drawer.hidden=false;document.querySelectorAll('.icon-btn').forEach(b=>b.classList.remove('active'));if(key==='tasks')document.getElementById('tasksBtn').classList.add('active');if(key==='approvals')document.getElementById('approvalsBtn').classList.add('active');if(key==='history')document.getElementById('historyBtn').classList.add('active');if(key==='captured'){const t=document.getElementById('capturedText');if(t)t.textContent=extra||''}if(key==='history'){const rows=document.getElementById('historyRows');if(rows){rows.innerHTML=history.length?history.map(h=>'<div class="item"><div class="item-top"><div class="item-title">Demande vocale</div><span class="pill">'+h.time+'</span></div><div class="meta">'+escapeHtml(h.text)+'</div></div>').join(''):'<div class="meta">Aucune demande dans cette session.</div>'}}}
 function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 core.addEventListener('click',listen);
 document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.panel)));
 document.getElementById('tasksBtn').addEventListener('click',()=>openPanel('tasks'));
 document.getElementById('approvalsBtn').addEventListener('click',()=>openPanel('approvals'));
 document.getElementById('historyBtn').addEventListener('click',()=>openPanel('history'));
 document.getElementById('closeDrawer').addEventListener('click',()=>{drawer.hidden=true;document.querySelectorAll('.icon-btn').forEach(b=>b.classList.remove('active'))});
 document.getElementById('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>notify('Plein écran indisponible'));else document.exitFullscreen?.()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer.hidden=true;if(recognition)recognition.stop()}});
